name: wirepod
version: "0.2.0"
description: Profile-bound Vector observation and bounded motion/expression controls.
manifest_version: 2
api_version: 1
tags: [wirepod, vector, robot]
provides_tools: [vector_status, vector_observe, vector_say, vector_drive, vector_move_head, vector_move_lift, vector_stop]
config_schema:
  bridge_url:
    type: str
    default: ""
    description: "Base URL of the wire-pod bridge, for example http://escapepod.local:8080"
  bridge_token:
    type: str
    default: ""
    description: "Bearer token shared only with this Vector profile"
  vector_esn:
    type: str
    default: ""
    description: "The one Vector ESN this profile is allowed to inspect"
  timeout_seconds:
    type: int
    default: 5
    description: "Bridge socket-inactivity timeout in seconds, from 1 through 15"
